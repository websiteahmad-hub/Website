<!DOCTYPE html>
<html lang="ckb" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <title>mam zagros</title>
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Apply saved theme/language before paint (no flash). Default: dark + Kurdish Sorani. */
    try {
      const d = document.documentElement, th = localStorage.getItem("mz-theme"), lg = localStorage.getItem("mz-lang");
      if (th === "light") d.dataset.theme = "light";
      if (lg === "en") { d.lang = "en"; d.dir = "ltr"; } else if (lg === "ar") { d.lang = "ar"; }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <img class="avatar" src="logo.jpg" alt="mam zagros">
    <div class="brand-name">mam zagros</div>
  </header>

  <main class="wrap">
    <!-- ===== Tab 1: Apps ===== -->
    <section id="tab-apps">
      <h1 data-i18n="apps"></h1>
      <p class="sub" data-i18n="subtitle"></p>
      <div class="badge" id="badge" hidden></div>
      <input class="search" id="q" type="search" data-i18n-ph="search" autocomplete="off">
      <div class="notice" id="notice" data-i18n="notice" hidden></div>
      <ul class="list" id="list"></ul>
    </section>

    <!-- ===== Tab 2: Settings ===== -->
    <section id="tab-settings" hidden>
      <h1 data-i18n="settings"></h1>

      <div class="label" data-i18n="language"></div>
      <div class="seg" id="seg-lang">
        <button data-lang="ckb">کوردی</button>
        <button data-lang="ar">العربية</button>
        <button data-lang="en">English</button>
      </div>

      <div class="label" data-i18n="appearance"></div>
      <div class="seg" id="seg-theme">
        <button data-theme="dark" data-i18n="dark"></button>
        <button data-theme="light" data-i18n="light"></button>
      </div>

      <div class="label" data-i18n="certTitle"></div>
      <div class="card">
        <label class="file"><span data-i18n="p12"></span><span class="fname" id="p12-name">—</span><input type="file" id="p12" accept=".p12,.pfx"></label>
        <label class="file"><span data-i18n="prov"></span><span class="fname" id="prov-name">—</span><input type="file" id="prov" accept=".mobileprovision"></label>
        <input class="field" type="password" id="pass" data-i18n-ph="password" autocomplete="off" autocapitalize="off">
        <button class="primary" id="verify" data-i18n="verify"></button>
        <div id="cert-status" role="status" aria-live="polite"></div>
        <p class="hint" data-i18n="certHint"></p>
      </div>

      <div class="label" data-i18n="community"></div>
      <div class="list compact">
        <a class="row" href="https://t.me/mamzaga" target="_blank" rel="noopener">
          <span class="sicon tg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></span>
          <span class="info"><div class="name" data-i18n="channel"></div><div class="meta" data-i18n="channelSub"></div></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="row" href="https://t.me/X_MAM6" target="_blank" rel="noopener">
          <span class="sicon msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg></span>
          <span class="info"><div class="name" data-i18n="contact"></div><div class="meta" data-i18n="contactSub"></div></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
      <footer data-i18n="footer"></footer>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="apps" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span data-i18n="apps"></span>
    </button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span data-i18n="settings"></span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
